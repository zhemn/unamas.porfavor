<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FFD23F">
<title>MA · UNA MÁS</title>
<meta name="author" content="vlfern">
<meta name="description" content="Microjuegos de cinco segundos. Hecho por vlfern.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000; --paper:#fff; --yolk:#FFD23F; --rose:#EE4266; --mint:#3BCEAC; --plum:#540D6E; --sky:#3A86FF;
  --hud-ink:#000; --panel:#fff;
  --big:'Dela Gothic One','Arial Black',Impact,sans-serif; --dot:'DotGothic16','Courier New',monospace;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --panel:#fff; } }
:root[data-theme="dark"]{ --panel:#fff; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--yolk);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--dot);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;color:var(--hud-ink)}
.stat{display:flex;flex-direction:column;align-items:flex-start;line-height:1;min-width:64px}
.stat.r{align-items:flex-end}
.stat b{font-family:var(--big);font-weight:400;font-size:30px}
.stat span{font-size:13px;margin-top:3px}
#mini{font-family:var(--big);font-size:15px;padding-top:6px;text-align:center;opacity:0;transition:opacity .15s;max-width:52vw;line-height:1.1}
#hud.on #mini{opacity:1}
#pause{pointer-events:auto;position:absolute;top:calc(env(safe-area-inset-top,0px) + 50px);left:50%;transform:translateX(-50%);background:none;border:0;padding:8px 14px;font-family:var(--big);font-size:14px;color:var(--hud-ink);opacity:.55}
#foot{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;align-items:center;gap:10px;pointer-events:none;color:var(--hud-ink)}
#bar{flex:1;height:14px;background:var(--paper);border:3px solid var(--paper);box-shadow:0 0 0 2px var(--ink);position:relative;overflow:hidden}
#bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--ink);transform-origin:left;display:block}
#bar.hot i{background:var(--rose)}
#count{font-family:var(--big);font-size:17px;width:30px;height:30px;line-height:28px;text-align:center;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:50%;visibility:hidden}
#count.on{visibility:visible}
#skip{pointer-events:auto;background:var(--paper);border:3px solid var(--ink);color:var(--ink);padding:9px 16px;font-family:var(--dot);font-size:16px;min-height:44px}
#skip:active{transform:translate(2px,2px)}
.hide{display:none!important}

/* Pantallas */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 7vh) 24px calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center}
#title .logo{font-family:var(--big);font-size:min(46vw,27vh);line-height:.8;letter-spacing:-.04em;margin:0;animation:bob 1.2s ease-in-out infinite alternate}
#title .band{display:inline-block;margin-top:2.4vh;background:var(--ink);color:var(--paper);font-family:var(--big);font-size:min(10.5vw,6.2vh);padding:.14em .5em .2em;transform:rotate(-5deg)}
#title p{font-size:17px;margin:3.4vh 0 0;max-width:30ch;line-height:1.35}
.big{background:var(--ink);color:var(--paper);border:0;font-family:var(--big);font-size:28px;padding:16px 44px 20px;margin-top:3vh;box-shadow:6px 6px 0 var(--rose);min-height:64px}
.big:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--rose)}
.row{display:flex;gap:18px;align-items:center;justify-content:center;margin-top:2.2vh;font-size:15px;flex-wrap:wrap}
.link{background:none;border:0;border-bottom:2px solid var(--ink);padding:6px 2px;font-size:15px}
.keys{font-size:13px;color:var(--paper);opacity:.8;margin-top:auto;max-width:34ch}
#paused{background:rgba(0,0,0,.72);color:var(--paper);justify-content:center}
#paused h2{font-family:var(--big);font-weight:400;font-size:52px;margin:0}
#paused .big{background:var(--paper);color:var(--ink)}
#paused .link{color:var(--paper);border-color:var(--paper);margin-top:18px}
.lockup{position:relative;display:inline-block}
.hanko{position:absolute;right:-.72em;bottom:.12em;width:min(15vw,9vh);height:min(15vw,9vh);color:var(--rose);transform:rotate(8deg);display:block;opacity:.95}
.hanko svg{width:100%;height:100%;display:block}
.hanko.sm{position:static;display:inline-block;width:22px;height:22px;vertical-align:middle;margin-right:6px;color:var(--paper);transform:rotate(6deg)}
.sig{margin-top:1.6vh;font-size:14px}
.sig b{font-family:var(--big);font-weight:400;font-size:15px}
.credit{margin-top:28px;font-size:13px;opacity:.8}
@keyframes bob{to{transform:translateY(6px) rotate(-1deg)}}
@media (prefers-reduced-motion: reduce){#title .logo{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Zona de juego"></canvas>
  <header id="hud" class="hide">
    <div class="stat"><b id="streak">0</b><span>racha</span></div>
    <div id="mini"></div>
    <div class="stat r"><b id="best">0</b><span>récord</span></div>
  </header>
  <button id="pause" class="hide" aria-label="Pausa">II</button>
  <footer id="foot" class="hide"><div id="bar"><i></i></div><span id="count"></span><button id="skip">Saltar</button></footer>

  <section id="title" class="screen">
    <div class="lockup"><h1 class="logo">MA</h1><span class="hanko" aria-hidden="true"><svg viewBox="0 0 100 100"><rect x="7" y="7" width="86" height="86" rx="6" fill="none" stroke="currentColor" stroke-width="8"/><path d="M22 30 H78 L46 74" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/><path d="M34 47 L55 62" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="square"/></svg></span></div>
    <div class="band">UNA MÁS</div>
    <p>Una orden, cinco segundos y a la siguiente. Encadena todas las que puedas.</p>
    <button class="big" id="play">Jugar</button>
    <div class="row"><span>récord <b id="best0">0</b></span><button class="link" id="snd">Sonido: sí</button><button class="link" id="mus">Música: sí</button></div>
    <div class="sig">hecho por <b>vlfern</b></div>
    <div class="keys">Con teclado: flechas para mover la mira, espacio para tocar o mantener, S para saltar ronda.</div>
  </section>
  <section id="paused" class="screen hide">
    <h2>Pausa</h2>
    <button class="big" id="resume">Seguir</button>
    <button class="link" id="quit">Volver al inicio</button>
    <p class="credit"><span class="hanko sm" aria-hidden="true"><svg viewBox="0 0 100 100"><rect x="7" y="7" width="86" height="86" rx="6" fill="none" stroke="currentColor" stroke-width="8"/><path d="M22 30 H78 L46 74" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/><path d="M34 47 L55 62" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="square"/></svg></span> MA · UNA MÁS — vlfern, 2026</p>
  </section>
</div>
<script>
'use strict';
// ============ MA · UNA MÁS — microjuegos ============
// Coordenadas lógicas: 360 x 640. El estado se evalúa siempre con lo último dibujado:
// el motor aplica los eventos ANTES de update(), así lo que ves es lo que cuenta.
const W = 360, H = 640, EXT = 600, TAU = Math.PI * 2;
const C = { ink: '#000', paper: '#fff', yolk: '#FFD23F', rose: '#EE4266', mint: '#3BCEAC', plum: '#540D6E', sky: '#3A86FF' };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hyp = Math.hypot;
const rectsHit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function circRect(cx, cy, r, x, y, w, h) { const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h); return (cx - nx) ** 2 + (cy - ny) ** 2 <= r * r; }
function segX(ax, ay, bx, by, cx, cy, dx, dy) {
  const d = (bx - ax) * (dy - cy) - (by - ay) * (dx - cx); if (!d) return false;
  const t = ((cx - ax) * (dy - cy) - (cy - ay) * (dx - cx)) / d, u = ((cx - ax) * (by - ay) - (cy - ay) * (bx - ax)) / d;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}
const wrapA = a => ((a % TAU) + TAU) % TAU;
const dA = a => wrapA(a + Math.PI) - Math.PI;
const pick = (R, arr) => arr[Math.floor(R() * arr.length)];
function shuffle(R, a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- dibujo ----------
function P(g, f, s, lw) { if (f) { g.fillStyle = f; g.fill(); } if (s !== null && s !== false) { g.lineWidth = lw || 4; g.strokeStyle = s || C.ink; g.stroke(); } }
function Rc(g, x, y, w, h, f, s, lw) { g.beginPath(); g.rect(x, y, w, h); P(g, f, s, lw); }
function Ci(g, x, y, r, f, s, lw) { g.beginPath(); g.arc(x, y, Math.max(0.1, r), 0, TAU); P(g, f, s, lw); }
function El(g, x, y, rx, ry, f, s, lw, rot) { g.beginPath(); g.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot || 0, 0, TAU); P(g, f, s, lw); }
function Ln(g, x1, y1, x2, y2, c, lw) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineWidth = lw || 4; g.strokeStyle = c || C.ink; g.lineCap = 'round'; g.stroke(); g.lineCap = 'butt'; }
function Pg(g, pts, f, s, lw) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); P(g, f, s, lw); }
function Tx(g, str, x, y, size, col, big, align) { g.font = `${size}px ${big ? "'Dela Gothic One'" : "'DotGothic16'"}, 'Arial Black', sans-serif`; g.textAlign = align || 'center'; g.textBaseline = 'middle'; g.fillStyle = col || C.ink; g.fillText(str, x, y); }
function floor_(g, y, f) { Rc(g, -EXT, y, W + 2 * EXT, H + EXT, f || C.ink, null); }
function dash(g, on) { g.setLineDash(on ? [8, 7] : []); }
function smoke(g, x, y, t, n) { for (let i = 0; i < (n || 3); i++) { const k = ((t * 0.9 + i / 3) % 1); Ci(g, x + Math.sin(t * 3 + i * 2) * 8 * k, y - k * 70, 6 + k * 14, `rgba(255,255,255,${0.9 - k * 0.8})`, null); } }
function stars(g, x, y, t, col) { for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + t * 2, r = 30 + (t * 90 % 40); Ln(g, x + Math.cos(a) * r, y + Math.sin(a) * r, x + Math.cos(a) * (r + 10), y + Math.sin(a) * (r + 10), col || C.ink, 4); } }

// Personaje "Ma": cabeza cúbica, dos ojos-barra. (x,y) = pies. Caja de colisión: x±10, y-48..y
function dude(g, x, y, o) {
  o = o || {}; g.save(); g.translate(x, y); const k = o.s || 1; g.scale(k * (o.flip ? -1 : 1), k); if (o.rot) g.rotate(o.rot);
  const f = o.fill || C.paper, lp = o.leg || 0, arms = o.arms || 'down', ink = C.ink;
  Ln(g, -6, -16, -6 - 7 * Math.sin(lp), 0, ink); Ln(g, 6, -16, 6 + 7 * Math.sin(lp), 0, ink);
  if (arms === 'up') { Ln(g, -10, -24, -21, -42, ink); Ln(g, 10, -24, 21, -42, ink); }
  else if (arms === 'out') { Ln(g, -10, -22, -26, -26, ink); Ln(g, 10, -22, 26, -26, ink); }
  else { Ln(g, -10, -24, -19, -12, ink); Ln(g, 10, -24, 19, -12, ink); }
  Rc(g, -11, -28, 22, 13, f); Rc(g, -15, -50, 30, 24, f);
  const m = o.mood || 'n'; g.fillStyle = ink;
  if (m === 'x') { [-7, 7].forEach(ex => { Ln(g, ex - 3, -42, ex + 3, -36, ink, 3); Ln(g, ex + 3, -42, ex - 3, -36, ink, 3); }); }
  else if (m === 'happy') { g.lineWidth = 3; g.strokeStyle = ink; [-7, 7].forEach(ex => { g.beginPath(); g.arc(ex, -37, 4, Math.PI, 0); g.stroke(); }); }
  else if (m === 'o') { g.fillRect(-9, -44, 4, 9); g.fillRect(5, -44, 4, 9); Ci(g, 0, -31, 3, ink, null); }
  else { const lk = o.look || 0; g.fillRect(-9 + lk, -44, 4, 9); g.fillRect(5 + lk, -44, 4, 9); }
  g.restore();
}
const dudeBox = (x, y) => ({ x: x - 10, y: y - 48, w: 20, h: 46 });

const GAMES = [];
const G = d => GAMES.push(d);

// ================= 1. SALTA (toque a tiempo) =================
G({
  id: 'salta', cmd: '¡SALTA!', how: 'toca para saltar', bg: C.yolk, T: 4.2,
  init(s, R) {
    s.gy = 470; s.p = { x: 90, y: 470, vy: 0 }; const x0 = 380 + R() * 90;
    s.os = [{ x: x0, w: 32, h: 40 }, { x: x0 + 270 + R() * 50, w: 32, h: 40 }]; s.v = 250;
  },
  down(s) { const p = s.p; if (p.y >= s.gy - 0.01) p.vy = -620; },
  update(s, dt) {
    const p = s.p; p.vy += 1900 * dt; p.y += p.vy * dt; if (p.y >= s.gy) { p.y = s.gy; p.vy = 0; }
    if (s.res === 'lose') return;
    s.os.forEach(o => o.x -= s.v * dt);
    if (!s.res) {
      const pb = dudeBox(p.x, p.y);
      for (const o of s.os) { const ob = { x: o.x + 2, y: s.gy - o.h + 2, w: o.w - 4, h: o.h - 2 }; if (rectsHit(pb, ob)) { s.res = 'lose'; return; } }
      if (s.os.every(o => o.x + o.w < pb.x)) s.res = 'win';
    }
  },
  draw(g, s) {
    floor_(g, s.gy); Ln(g, -EXT, s.gy - 2, W + EXT, s.gy - 2, C.paper, 2);
    if (!s.noClouds) for (let i = 0; i < 5; i++) { const x = ((i * 90 - s.t * (s.res === 'lose' ? 0 : s.v) * .5) % 450 + 450) % 450 - 45; Rc(g, x, 150 + (i % 2) * 40, 50, 14, C.paper, null); }
    s.os.forEach(o => { Rc(g, o.x, s.gy - o.h, o.w, o.h, C.rose); Ln(g, o.x, s.gy - o.h, o.x + o.w, s.gy, C.ink, 3); Ln(g, o.x + o.w, s.gy - o.h, o.x, s.gy, C.ink, 3); });
    const p = s.p, air = p.y < s.gy - 1;
    dude(g, p.x, p.y, { leg: air ? 0.9 : s.t * 18, arms: air ? 'up' : 'down', mood: s.res === 'lose' ? 'x' : s.res === 'win' ? 'happy' : 'n', look: 3 });
  }
});

// ================= 2. ENCESTA (deslizar para lanzar) =================
G({
  id: 'encesta', cmd: '¡ENCESTA!', how: 'desliza hacia la canasta', bg: C.sky, T: 5,
  init(s, R) { s.hy = 190; s.amp = 70; s.w = 1.2; s.ph = R() * TAU; s.hx = 180 + s.amp * Math.sin(s.ph); s.reset = () => { s.b = { x: 180, y: 550, vx: 0, vy: 0, st: 'ready', k: 0 }; }; s.reset(); },
  hx(s, t) { return 180 + s.amp * Math.sin(s.w * t + s.ph); },
  swipe(s, dx, dy) {
    const b = s.b; if (b.st !== 'ready' || dy > -30) return;
    const L = hyp(dx, dy); b.vx = dx / L * 1100; b.vy = dy / L * 1100; b.st = 'fly'; s.pending = true;
  },
  update(s, dt) {
    s.hx = this.hx(s, s.t); const b = s.b;
    if (b.st === 'fly' || b.st === 'miss') {
      const py = b.y, px = b.x; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.st === 'miss') b.vy += 1400 * dt;
      if (b.x < 16) { b.x = 32 - b.x; b.vx = -b.vx; } if (b.x > 344) { b.x = 688 - b.x; b.vx = -b.vx; }
      if (b.st === 'fly' && py > s.hy && b.y <= s.hy) {
        const xc = px + (b.x - px) * (py - s.hy) / (py - b.y), off = xc - s.hx;
        if (Math.abs(off) <= 30) { b.st = 'in'; b.off = off; b.y = s.hy - 20; b.vy = -200; s.res = 'win'; s.pending = false; }
        else if (Math.abs(off) <= 58) { b.st = 'miss'; b.vy = 380; b.vx = Math.sign(off) * 260; b.k = 0; }
      }
      if (b.st === 'fly' && b.y < -60) { b.st = 'miss'; }
      b.k += dt;
      if (b.st === 'miss' && (b.y > 700 || b.y < -80 || b.k > 0.9)) { s.reset(); s.pending = false; }
    } else if (b.st === 'in') { b.vy += 1200 * dt; b.y += b.vy * dt; b.off *= 0.85; b.x = s.hx + b.off; if (b.y > s.hy + 40) b.y = Math.min(b.y, 600); }
  },
  draw(g, s) {
    floor_(g, 600, C.ink);
    const hx = s.hx, hy = s.hy, b = s.b;
    Rc(g, hx - 55, hy - 90, 110, 74, C.paper); Rc(g, hx - 22, hy - 50, 44, 30, null);
    const back = () => { Ln(g, hx - 40, hy, hx + 40, hy, C.rose, 7); };
    const net = () => { for (let i = -2; i <= 2; i++) Ln(g, hx + i * 16, hy + 2, hx + i * 9, hy + 44, C.paper, 3); Ln(g, hx - 32, hy + 22, hx + 32, hy + 22, C.paper, 3); };
    const rim = () => { Rc(g, hx - 48, hy - 5, 8, 10, C.rose); Rc(g, hx + 40, hy - 5, 8, 10, C.rose); };
    back();
    const ball = () => { Ci(g, b.x, b.y, 16, C.yolk); Ln(g, b.x - 16, b.y, b.x + 16, b.y, C.ink, 3); Ln(g, b.x, b.y - 16, b.x, b.y + 16, C.ink, 3); };
    if (b.st === 'in') { ball(); net(); rim(); } else { net(); rim(); ball(); }
    if (b.st === 'ready') { dash(g, 1); Ln(g, 180, 520, 180, 470, C.paper, 3); dash(g, 0); Pg(g, [[170, 474], [190, 474], [180, 458]], C.paper, null); }
    dude(g, 110, 600, { mood: s.res === 'win' ? 'happy' : 'n', arms: s.res === 'win' ? 'up' : 'out', look: 3 });
  }
});

// ================= 3. MARCA (tocar dónde chutar) =================
G({
  id: 'marca', cmd: '¡MARCA!', how: 'toca donde chutar', bg: C.mint, T: 3.6,
  init(s, R) { s.gx = 30; s.gw = 300; s.gt = 150; s.gb = 290; s.ph = R() * TAU; s.kw = 70; s.kh = 110; s.b = { x: 180, y: 560, st: 'ready', k: 0 }; s.kx = this.kx(s, 0); },
  kx(s, t) { return 180 + 92 * Math.sin(2.1 * t + s.ph); },
  down(s, x, y) {
    const b = s.b; if (b.st !== 'ready' || y > 380) return;
    b.tx = x; b.ty = y; b.st = 'fly'; b.k = 0; s.pending = true;
  },
  update(s, dt) {
    if (!(s.res && s.saved)) s.kx = this.kx(s, s.t);
    const b = s.b;
    if (b.st === 'fly') {
      b.k += dt / 0.32; const k = Math.min(1, b.k);
      b.x = 180 + (b.tx - 180) * k; b.y = 560 + (b.ty - 560) * k - Math.sin(k * Math.PI) * 40;
      if (k >= 1) {
        const r = 9, kr = { x: s.kx - s.kw / 2 + 3, y: s.gb - s.kh + 3, w: s.kw - 6, h: s.kh - 3 };
        const inGoal = b.tx >= s.gx && b.tx <= s.gx + s.gw && b.ty >= s.gt && b.ty <= s.gb;
        if (inGoal && circRect(b.tx, b.ty, r - 2, kr.x, kr.y, kr.w, kr.h)) { s.res = 'lose'; s.saved = true; b.st = 'saved'; }
        else if (inGoal) { s.res = 'win'; b.st = 'goal'; }
        else { s.res = 'lose'; b.st = 'wide'; }
        s.pending = false;
      }
    }
  },
  draw(g, s) {
    floor_(g, 290, '#2a9d7f'); Ln(g, -EXT, 290, W + EXT, 290, C.paper, 3);
    Pg(g, [[60, 640], [300, 640], [250, 420], [110, 420]], null, C.paper, 3);
